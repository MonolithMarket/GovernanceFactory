[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via-ir = true
solc = "0.8.26"
# Keep expected-constructor-revert tests on ordinary deployment paths.
dynamic_test_linking = false
fs_permissions = [{ access = "read", path = "./integration/monolith/out" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.personal-staking]
match_path = "test/personal-staking/*.t.sol"
# The 0.8.24 integration tests deploy these native governance artifacts.
build_info = true

[profile.personal-staking.fuzz]
runs = 512

[profile.personal-staking.invariant]
runs = 128
depth = 64
fail_on_revert = true
